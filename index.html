/* ===== Designsystem: dunkel, Apple-inspiriert, ohne backdrop-filter (Mi Pad 3 / Android 7) ===== */
*{box-sizing:border-box;margin:0;padding:0}

#view{position:absolute;left:0;top:0;width:100%;height:100%;padding:.6vh 2.6vh .8vh;opacity:1;transition:opacity .32s ease}

#prog{position:absolute;left:3vh;right:3vh;bottom:13vh;height:.45vh;border-radius:1vh;background:rgba(255,255,255,.1);z-index:6;overflow:hidden}

/* Typografie */
.eb{font-size:2vh;font-weight:600;letter-spacing:.28vh;text-transform:uppercase;margin-bottom:1vh}
.h1{font-size:6.4vh;font-weight:700;line-height:1.08;letter-spacing:-.03em}
.h2{font-size:4.2vh;font-weight:650;line-height:1.14;letter-spacing:-.022em}
.h3{font-size:3.1vh;font-weight:600;line-height:1.2;letter-spacing:-.015em}
.bd{font-size:2.55vh;line-height:1.4;color:rgba(235,235,245,.84);font-weight:400}
.sm{font-size:2.1vh;line-height:1.35;color:rgba(235,235,245,.55)}
.lg{font-weight:300}
.dim{color:rgba(235,235,245,.55)}
.wh{color:#fff}
.ce{text-align:center}
.rt{text-align:right}

/* Layout */
.r{display:flex}.c{display:flex;flex-direction:column}
.f1{flex:1 1 0;min-width:0;min-height:0}.f2{flex:2 1 0;min-width:0;min-height:0}.f3{flex:3 1 0;min-width:0;min-height:0}
.fn{flex:none}
.ai{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}.as{align-items:stretch}
.ml{margin-left:1.8vh}.mr{margin-right:1.8vh}.mt{margin-top:1.4vh}.mb{margin-bottom:1.4vh}.mt2{margin-top:2.4vh}
.hd{overflow:hidden}
.fx{overflow:hidden;min-height:0}

.cc{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.11);border-radius:3vh;padding:2.2vh 2.6vh;box-shadow:0 1.4vh 3.4vh rgba(0,0,0,.28);overflow:hidden;min-height:0}
.cc.sol{background:rgba(255,255,255,.12)}
.cc.pad0{padding:0}
.chip{display:inline-block;padding:.55vh 1.6vh;border-radius:2.4vh;font-size:2.05vh;font-weight:550;background:rgba(255,255,255,.13);color:#fff;margin:0 1vh 1vh 0;letter-spacing:0;white-space:nowrap}
.dv{height:1px;background:rgba(255,255,255,.1);margin:1.3vh 0}
.ph{position:relative;overflow:hidden;border-radius:3vh;background:rgba(255,255,255,.06)}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.ph .ov{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0))}
.cr{position:absolute;right:1.4vh;bottom:.9vh;font-size:1.55vh;color:rgba(255,255,255,.62);letter-spacing:0}
.kv{display:flex;justify-content:space-between;font-size:2.3vh;padding:.75vh 0;border-bottom:1px solid rgba(255,255,255,.07)}
.kv:last-child{border-bottom:0}.kv span:first-child{color:rgba(235,235,245,.55)}.kv span:last-child{font-weight:550}
.num{font-weight:200;letter-spacing:-.04em;line-height:1}
.bar{height:.9vh;border-radius:1vh;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:1vh;transform-origin:0 50%}

.cal{display:flex;font-size:2.4vh;line-height:4.9vh;text-align:center}
.cal span,.cal b{flex:1;font-weight:400}.cal .k{flex:1.05;color:rgba(235,235,245,.38);font-size:2vh}
.cal i{display:inline-block;width:4.4vh;height:4.4vh;line-height:4.4vh;border-radius:50%;background:#ff453a;color:#fff;font-style:normal;font-weight:600}

/* Himmel */
@keyframes tw{50%{opacity:.25}}
.st{position:absolute;border-radius:50%;background:#fff}
.tw{animation:tw 3.4s ease-in-out infinite}

#dar{font-size:2.25vh;color:rgba(235,235,245,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3vh}

#dctl{display:flex;align-items:center}
.db{width:7.4vh;height:6.6vh;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .2s}

#dpp{width:9vh}#dpp svg{width:6.2vh;height:6.2vh}
#dock.off .db,#dock.idle .db{opacity:.32}
#dpr{display:flex;align-items:center;width:100%;margin-top:.2vh}
#dt1,#dt2{font-size:1.85vh;color:rgba(235,235,245,.5);width:6vh;font-variant-numeric:tabular-nums}
#dt2{text-align:right}
#dbr{flex:1;height:.8vh;border-radius:1vh;background:rgba(255,255,255,.18);overflow:hidden;margin:0 1.4vh}
#dbr i{display:block;width:100%;height:100%;border-radius:1vh;background:#fff;transform-origin:0 50%;transform:scaleX(0)}

#dock.on #dst{background:rgba(48,209,88,.18);color:#5fe08a}
#dock.off #dst{background:#1db954;color:#06210f}

/* ===== Jetzt-läuft-Szene mit Schallplatte ===== */
#np{position:absolute;left:0;top:0;width:100%;height:100%;padding:.6vh 2.6vh;opacity:0;pointer-events:none;transition:opacity .5s ease;visibility:hidden;z-index:3}
#np.on{opacity:1;visibility:visible}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#vw{position:relative;width:72vh;height:72vh;flex:none;margin:2vh 0 0 1vh}
#vy{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#101012 0,#101012 .35vh,#17171a .35vh,#17171a .7vh);box-shadow:0 2.4vh 6vh rgba(0,0,0,.65);animation:spin 7.2s linear infinite;animation-play-state:paused;will-change:transform}
#np.on.pl #vy{animation-play-state:running}
#vy .gr{position:absolute;left:3%;top:3%;width:94%;height:94%;border-radius:50%;border:1px solid rgba(255,255,255,.05)}
#vy .gr2{left:12%;top:12%;width:76%;height:76%}
#vy .gr3{left:22%;top:22%;width:56%;height:56%}
#vlb{position:absolute;left:31%;top:31%;width:38%;height:38%;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,#1db954,#0a84ff);border:.5vh solid #0c0c0e}
#vlb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
#vsp{position:absolute;left:47.4%;top:47.4%;width:5.2%;height:5.2%;border-radius:50%;background:#050506;border:1px solid rgba(255,255,255,.2)}
#vsh{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:50%;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.1) 42%,rgba(255,255,255,0) 54%,rgba(255,255,255,0) 72%,rgba(255,255,255,.07) 82%,rgba(255,255,255,0) 92%);pointer-events:none}
#arm{position:absolute;right:-3vh;top:-2vh;width:27vh;height:27vh;transform-origin:88% 12%;transform:rotate(-24deg);transition:transform 1.4s ease}
#np.pl #arm{transform:rotate(2deg)}
#npx{position:absolute;left:79vh;right:2.6vh;top:.6vh;bottom:.8vh}

var JK=["Ich bin nicht faul, ich befinde mich im Energiesparmodus bis zum Tod.","Der frühe Vogel fängt den Wurm. Der Wurm hätte liegen bleiben sollen.","Das Leben ist wie ein Buffet: Man nimmt zu viel und am Ende zahlt der Körper.","Zeit heilt alle Wunden. Sie ist nur sehr großzügig mit den Nebenwirkungen.","Optimisten sehen das Licht am Ende des Tunnels. Realisten sehen den Zug.","Ich habe keine Probleme, nur Bonuslevel mit schlechter Beleuchtung.","Mein Akku hält länger als meine guten Vorsätze, und das will was heißen.","Der Tod ist sicher. Die Steuererklärung leider auch.","Ich bin nicht verwirrt, nur sehr viele Tabs im Kopf sind offen und keiner lädt.","Geld macht nicht glücklich, hat mein Kontostand persönlich genommen.","Schlaf ist der kleine Bruder des Todes. Ich übe schon mal.","Ich habe mir Ziele gesetzt. Das Leben hat mich geblockt.","Erwartungen sind vorgeplante Enttäuschungen mit höflicher Anrede.","Mein innerer Schweinehund hat inzwischen einen Anwalt.","Ich denke positiv: Schlimmer geht immer, aber ich bin ja noch nicht fertig.","Das Universum ist unendlich, genau wie meine Ausreden.","Alles hat ein Ende, nur mein Dispo nicht.","Wenn das Leben dir Zitronen gibt, bestell einen Anwalt: Sie sind abgelaufen.","Ich bin Frühaufsteher. Nur dauert das Aufstehen etwas länger.","Hoffnung ist der Wecker, der klingelt, obwohl das Leben Schlummern gedrückt hat."];
var WS=["Fang an, bevor du bereit bist.","Du musst nicht den ganzen Weg sehen, nur den nächsten Schritt.","Ruhe ist keine Pause vom Leben, sondern ein Teil davon.","Was du heute tust, wird morgen zur Gewohnheit.","Gelassenheit ist Stärke ohne Lärm.","Klarheit entsteht beim Tun, nicht beim Grübeln.","Kleine Schritte sind trotzdem Schritte.","Auch ein langsamer Fluss erreicht das Meer.","Nicht alles, was zählt, lässt sich zählen.","Gute Dinge brauchen Zeit und Geduld.","Wer sich selbst treu bleibt, muss nichts spielen.","Fehler sind Beweise, dass du es versuchst.","Tu heute etwas, wofür dein späteres Ich dankbar ist.","Fokus ist die leise Art von Mut.","Das Beste kommt oft leise.","Weniger Lärm, mehr Wesentliches.","Jeder Tag ist ein leeres Blatt.","Geh dein Tempo, aber geh.","Vertraue dem Prozess, auch wenn er holpert.","Schönes entsteht im Dazwischen."];
var WSX=["Anfangen ist oft der schwerste Teil, weil unser Kopf Perfektion verlangt. Wer startet, bekommt Rückmeldung von der Wirklichkeit, und die ist meist freundlicher als die Vorstellung.","Wege werden selten vorab vollständig sichtbar. Wer nur den nächsten Schritt plant, bleibt beweglich und überfordert sich nicht.","Erholung ist keine verlorene Zeit. Schlaf, Spaziergänge und Stille sind Teil dessen, wie Gedächtnis und Kreativität arbeiten.","Gewohnheiten entstehen durch Wiederholung, nicht durch Intensität. Zwei Minuten täglich schlagen zwei Stunden einmal im Monat.","Gelassenheit heißt nicht Gleichgültigkeit. Sie ist die Fähigkeit, zwischen Reiz und Reaktion einen Moment Raum zu lassen.","Gedanken drehen sich oft im Kreis, solange nichts passiert. Eine kleine Handlung liefert neue Information und bricht die Schleife.","Fortschritt zeigt sich selten dramatisch, sondern in der Summe vieler unscheinbarer Tage.","Geduld ist kein Stillstand: Ein Fluss gibt nicht auf, er sucht sich seinen Weg.","Vieles Wertvolle – Vertrauen, Freundschaft, Gesundheit – lässt sich schwer messen und ist trotzdem entscheidend.","Qualität braucht Zeit. Wer das akzeptiert, ärgert sich weniger über Umwege.","Authentizität kostet weniger Kraft als Rollenspiel, auch wenn sie zunächst ungewohnt wirkt.","Wer nie scheitert, probiert vermutlich zu wenig aus. Fehler sind Daten, keine Urteile.","Frage dich am Abend: Würde mein späteres Ich dieses Verhalten gutheißen? Meist reicht diese Frage zur Orientierung.","Fokus heißt, vieles bewusst nicht zu tun. Das erfordert Mut gegen den Strom der Ablenkungen.","Nicht jeder Erfolg ist laut. Stetige, ruhige Arbeit trägt oft weiter als spektakuläre Momente.","Reduktion schafft Platz: weniger Eingänge, weniger Entscheidungen, mehr Aufmerksamkeit für das, was zählt.","Ein neuer Tag bietet einen unbeschriebenen Anfang, auch wenn der gestrige noch nachwirkt.","Tempo ist individuell. Vergleiche verzerren, denn du siehst bei anderen nur das Ergebnis, nicht den Weg.","Vertrauen heißt nicht Passivität, sondern weiterzugehen, obwohl nicht alles planbar ist.","Viele schöne Momente entstehen in Pausen, auf Wegen und in Gesprächen, nicht in den Höhepunkten."];
var GRM=["Ein ruhiger Morgen, ein klarer Gedanke.","Der Tag ist noch unbeschrieben.","Starte in deinem Tempo.","Ein guter Anfang braucht kein großes Vorhaben."],

var TAGFOK=["Klarheit: Was ist heute wirklich wichtig, und was nur dringend?","Ruhe: Eine Sache nach der anderen, ohne Hektik.","Verbindung: Ein ehrliches Gespräch führen oder eine Nachricht schreiben.","Ordnung: Einen Bereich aufräumen, der Energie kostet.","Lernen: Eine Sache verstehen, die du bisher nur benutzt hast.","Bewegung: Dem Körper Aufmerksamkeit schenken.","Kreativität: Etwas machen, das nicht nützlich sein muss.","Abschluss: Ein offenes Thema zu Ende bringen.","Genuss: Eine Mahlzeit oder Pause bewusst erleben.","Gesundheit: Schlaf, Wasser, frische Luft.","Planung: Die nächsten Tage in groben Zügen ordnen.","Dankbarkeit: Drei Dinge bemerken, die funktionieren."];
var TAGAUF=["Trinke ein Glas Wasser und öffne für fünf Minuten das Fenster.","Schreibe drei Dinge auf, die heute erledigt werden müssen, und nicht mehr.","Schicke einer Person eine kurze, freundliche Nachricht.","Räume zehn Minuten lang einen Bereich auf, der dich stört.","Gehe vor dem Abend einmal um den Block, ohne Kopfhörer.","Lies zehn Minuten in einem Buch oder Artikel, der dich wirklich interessiert.","Mache eine Dehnübung für Nacken und Rücken.","Lösche zehn alte Fotos, Apps oder Dateien, die du nicht brauchst.","Koche heute etwas Einfaches von Grund auf.","Notiere eine Frage, die du dieses Jahr beantworten möchtest.","Rufe jemanden an, statt zu schreiben.","Plane morgen schon heute eine Sache vor.","Schalte vor dem Schlafen eine Stunde früher den Bildschirm aus.","Lerne ein neues Wort, eine Formel oder einen Handgriff."];
var WTAG=[["Sonntag: Raum für Ruhe, Familie und Vorbereitung auf die Woche.","Ein gemütlicher Vormittag ohne Termine tut gut.","Zeit an der frischen Luft hilft, den Kopf frei zu bekommen.","Am Abend die kommende Woche grob vorplanen."],["Montag: Starte mit drei klaren Prioritäten.","Vormittags die schwierigste Aufgabe zuerst erledigen.","Mittags eine echte Pause einlegen.","Am Nachmittag Kommunikation und Absprachen bündeln."],["Dienstag: Der Tag für konzentrierte, ungestörte Arbeit.","Plane einen Block von 90 Minuten ohne Ablenkung.","Nach dem Mittag kurz bewegen.","Abends bewusst abschalten."],["Mittwoch: Halbzeit der Woche, Zwischenbilanz ziehen.","Was ist erledigt, was darf wegfallen?","Ein Gespräch führen, das du vor dir herschiebst.","Abends etwas Schönes für dich einplanen."],["Donnerstag: Offene Enden zusammenführen.","Mails, Formulare und Anrufe erledigen.","Nachmittags mit dem Wochenende im Blick vorplanen.","Abends Kontakte pflegen."],["Freitag: Abschließen und Ausklingen lassen.","Vormittags die wichtigsten Aufgaben beenden.","Nachmittags aufräumen und Offenes notieren.","Abends bewusst in das Wochenende wechseln."],["Samstag: Zeit für Besorgungen, Hobbys und Erholung.","Vormittags erledigen, was liegt geblieben ist.","Nachmittags etwas Draußen-Zeit oder Kreatives.","Abends gutes Essen, Musik oder Freunde."]];

var TR=[
["Der Narr","ein mutiger Neubeginn mit offenem Ausgang","Der Narr steht für den Aufbruch ins Unbekannte, für Unbefangenheit, Spontaneität und Vertrauen ins Leben. In der Tradition ist er die Karte des Anfangs vor jeder Erfahrung.","Ein junger Wanderer schreitet an einem Klippenrand entlang und blickt nach oben. Die weiße Rose steht für Reinheit, das Bündel für mitgebrachte Erfahrungen, der kleine Hund für wache Instinkte, die Sonne für Zuversicht.","Psychologisch beschreibt der Narr die Bereitschaft, Kontrolle abzugeben und Neues auszuprobieren. Er verkörpert kindliche Neugier, aber auch die Gefahr, Risiken auszublenden.","Im Alltag zeigt er sich bei einem Jobwechsel, einem Umzug, einem neuen Hobby oder dem Mut, ohne perfekten Plan loszugehen.","Die Schattenseite ist Leichtsinn: Entscheidungen ohne Vorbereitung, Realitätsverweigerung oder das Weglaufen vor Verantwortung.","Wähle heute einen kleinen, bewusst unperfekten ersten Schritt und starte, bevor du dich bereit fühlst.","Was würde ich beginnen, wenn ich wüsste, dass Scheitern erlaubt ist?"],
["Der Magier","gebündelte Willenskraft und die Fähigkeit, Ideen in Handlung zu verwandeln","Der Magier steht für Wille, Geschick, Konzentration und Manifestation. Er erinnert daran, dass die nötigen Mittel meist schon vorhanden sind.","Auf dem Tisch liegen Stab, Kelch, Schwert und Münze, die vier Elemente. Eine Hand zeigt zum Himmel, die andere zur Erde: wie oben, so unten. Das liegende Achter-Symbol über dem Kopf steht für Unendlichkeit.","Die Karte beschreibt Selbstwirksamkeit, das Erleben, durch eigenes Handeln etwas bewirken zu können. Sie verbindet Fokus mit Kommunikation.","Typisch sind Präsentationen, Projekte, Verhandlungen oder kreative Arbeit, bei denen Fähigkeiten gezielt zusammenkommen.","Im Schatten liegen Manipulation, Blendwerk und Selbstüberschätzung: Talent ohne Integrität.","Sortiere deine Mittel: Notiere drei Dinge, die du kannst und heute konkret einsetzen kannst.","Welche meiner Fähigkeiten nutze ich zu wenig?"],
["Die Hohepriesterin","leise Intuition, Geheimnis und inneres Wissen","Die Hohepriesterin verkörpert Intuition, Stille und verborgenes Wissen. Sie lädt dazu ein, zuzuhören statt zu handeln.","Sie sitzt zwischen zwei Säulen, die die Polaritäten darstellen. Der Vorhang mit Granatäpfeln verhüllt das Unsichtbare, der Mond zu ihren Füßen verweist auf Zyklen und das Unbewusste, die Schriftrolle auf das noch nicht Gelesene.","Sie steht für den Zugang zum Unbewussten: Bauchgefühl, Träume, Ahnungen, also Wissen, das sich noch nicht in Worte fassen lässt.","Im Alltag ist es das Gefühl, dass etwas nicht stimmt oder noch nicht reif für eine Entscheidung ist; Geduld und Beobachten sind gefragt.","Schattenseiten sind Verschlossenheit, Grübeln, passives Abwarten und das Misstrauen gegenüber eigenen Gefühlen.","Nimm dir zehn Minuten Stille ohne Bildschirm und notiere, was dir dabei spontan auffällt.","Was weiß ich eigentlich schon, ohne es mir einzugestehen?"],
["Die Herrscherin","Fülle, Fürsorge und schöpferisches Wachstum","Die Herrscherin steht für Fruchtbarkeit, Genuss, Natürlichkeit und Fürsorge, das nährende Prinzip.","Auf einem Polster inmitten üppiger Natur sitzt sie mit Sternenkrone und Venus-Zeichen. Weizenfeld, Fluss und Wald zeigen Wachstum und Ernte; die zwölf Sterne verweisen auf den Jahreskreis.","Psychologisch beschreibt sie Selbstfürsorge, Sinnlichkeit und die Fähigkeit, etwas wachsen zu lassen: Projekte, Beziehungen, eigene Talente.","Gutes Essen, Zeit in der Natur, Kreativität, Wohnlichkeit, oder die Frage, wen und was du gerade nährst.","Im Schatten stehen Überfürsorge, Bequemlichkeit, Besitzdenken und Erstickendes durch zu viel Kümmern.","Tu dir heute bewusst etwas Gutes für die Sinne: kochen, spazieren gehen, Musik hören.","Wo wächst etwas in meinem Leben, das mehr Aufmerksamkeit verdient?"],
["Der Herrscher","Struktur, Verantwortung und klare Grenzen","Der Herrscher steht für Ordnung, Autorität, Stabilität und Verantwortung, das strukturierende Prinzip.","Er sitzt auf einem steinernen Thron mit Widderköpfen, Zeichen von Tatkraft, trägt Rüstung unter dem roten Gewand und hält Zepter und Reichsapfel. Die karge Berglandschaft betont Disziplin.","Er beschreibt Selbstdisziplin, Grenzen setzen und Verantwortung übernehmen; innerlich der Teil, der Pläne durchhält.","Budget, Termine, Verträge, Routinen: Alles, was Verlässlichkeit schafft, gehört zu dieser Karte.","Schattenseiten sind Starrheit, Kontrollzwang, Härte und die Unfähigkeit, Schwäche zuzulassen.","Lege eine klare Regel oder Grenze fest, die dir diese Woche Energie spart.","Wo brauche ich mehr Struktur, und wo erstickt sie mich?"],
["Der Hierophant","Überlieferung, Lernen und gemeinsame Werte","Der Hierophant steht für Tradition, Glaubenssysteme, Lehre und Zugehörigkeit zu Gemeinschaften und Institutionen.","Ein Lehrer mit dreifacher Krone hebt die Hand zum Segen für zwei Schüler. Die gekreuzten Schlüssel verweisen auf Wissen, das geöffnet oder verschlossen werden kann; die zwei Säulen auf den Rahmen der Regeln.","Er beschreibt, wie Normen und Vorbilder uns prägen: Werte, die wir übernommen haben und prüfen können.","Ausbildung, Mentoren, Rituale, Vereine, Familientraditionen: Wo lernst du von anderen oder gibst Wissen weiter?","Im Schatten stecken Dogmatismus, blinder Gehorsam und Konformitätsdruck.","Frage jemanden mit Erfahrung um Rat oder gib selbst etwas weiter, das du gelernt hast.","Welche übernommene Überzeugung möchte ich überprüfen?"],
["Die Liebenden","eine bewusste Entscheidung des Herzens und echte Verbindung","Die Liebenden stehen für Beziehung, Wahl und Übereinstimmung von Werten, deutlich mehr als nur Romantik.","Ein Paar steht unter einem Engel; hinter Mann und Frau erscheinen Baum der Erkenntnis und Baum des Lebens. Die Szene erinnert an das Paradies und an die Verantwortung für Entscheidungen.","Psychologisch geht es um Authentizität: Entscheidungen, die zu den eigenen Werten passen, und um Nähe, die Verletzlichkeit zulässt.","Beziehungen, Freundschaften, aber auch Weggabelungen im Beruf: Wofür entscheide ich mich wirklich?","Schattenseiten sind Unentschlossenheit, Abhängigkeit, Harmoniesucht und die Idealisierung des Gegenübers.","Formuliere ehrlich, was dir in einer wichtigen Beziehung wichtig ist, für dich und nicht als Vorwurf.","Welche Entscheidung trifft mein Herz bereits, die mein Kopf noch verhandelt?"],
["Der Wagen","Antrieb, Disziplin und Siegeswillen","Der Wagen steht für Zielstrebigkeit, Selbstbeherrschung und Fortschritt durch Willenskraft.","Ein Krieger lenkt einen Wagen, vor dem eine schwarze und eine weiße Sphinx liegen; er führt sie ohne Zügel allein durch Willen. Der Sternenbaldachin steht für höhere Orientierung, die Stadt im Hintergrund für das Erreichte.","Psychologisch geht es um die Integration widersprüchlicher Impulse, etwa Pflicht und Lust oder Mut und Angst, unter einer gemeinsamen Richtung.","Prüfungen, Wettbewerbe, Reisen, ein Projekt vor der Deadline: Konzentration setzt sich durch.","Schattenseiten: Verbissenheit, Aggression, Tunnelblick und Fortschritt um jeden Preis.","Definiere ein Etappenziel für heute und lass dich nicht ablenken, bis es erledigt ist.","Welche widerstreitenden Impulse brauchen in mir eine gemeinsame Richtung?"],
["Die Kraft","sanfte Stärke, Geduld und Selbstbeherrschung","Die Kraft steht für Mut, Mitgefühl und innere Stärke, die ohne Gewalt auskommt.","Eine Frau schließt dem Löwen sanft das Maul. Das liegende Achter-Symbol über ihr steht für Unendlichkeit, ihr weißes Gewand für Klarheit, der Löwe für Instinkte, die gezähmt statt unterdrückt werden.","Gemeint ist Affektregulation: Gefühle wahrnehmen und lenken, statt sie zu verdrängen oder von ihnen gelenkt zu werden.","Konflikte, Stress, Ängste: ruhig bleiben, atmen, freundlich standhalten.","Schattenseiten: Selbstzweifel, unterdrückte Wut, Erschöpfung durch ständiges Zusammenreißen.","Atme vor der nächsten schwierigen Reaktion dreimal tief aus und antworte dann.","Wo wäre Freundlichkeit stärker als Härte?"],
["Der Eremit","Rückzug, Selbsterkenntnis und Orientierung von innen","Der Eremit steht für Einkehr, Weisheit und die Suche nach eigenen Antworten.","Auf einem verschneiten Gipfel hält ein Alter eine Laterne mit sechszackigem Stern und stützt sich auf einen Stab. Die Höhe steht für Abstand, das kleine Licht für Erkenntnis, die nur den nächsten Schritt beleuchtet.","Psychologisch geht es um bewusste Selbstreflexion und um das Alleinsein als Ressource statt als Mangel.","Ruhephasen, Tagebuch, Spaziergänge, Entscheidungen, die Abstand brauchen.","Schatten: Isolation, Weltflucht, Verbitterung, Rückzug aus Angst.","Plane heute eine halbe Stunde allein und ohne Ablenkung, vielleicht draußen.","Was möchte ich verstehen, wenn alle Stimmen von außen leiser werden?"],
["Das Rad des Schicksals","Wandel, Zyklen und die Annahme dessen, was sich nicht kontrollieren lässt","Das Rad steht für Zyklen, Wendepunkte und Fügungen: Nichts bleibt, wie es ist.","Ein Rad mit alchemistischen Zeichen und den Buchstaben TARO und ROTA dreht sich zwischen Wolken. In den Ecken tragen vier geflügelte Wesen Bücher; Schlange und Anubis zeigen Auf und Ab.","Sie beschreibt den Umgang mit Veränderung und Zufall: Was liegt in meinem Einflussbereich, was nicht?","Unerwartete Wendungen, Glück und Pech, Phasen in Beruf oder Beziehung: Alles hat einen Rhythmus.","Schattenseiten sind Fatalismus, Opferrolle und das Warten auf Glück statt Handeln.","Frage dich, was du heute ändern kannst, und akzeptiere, was nicht.","Was darf sich drehen, wenn ich loslasse?"],
["Gerechtigkeit","Klarheit, Fairness und die Folgen des eigenen Handelns","Gerechtigkeit steht für Wahrheit, Ausgleich, Verantwortung sowie Ursache und Wirkung.","Eine thronende Gestalt hält Waage und aufrechtes Schwert: Abwägen und Entscheiden. Der rote Mantel steht für Verantwortung, der Vorhang hinter ihr für Neutralität.","Psychologisch geht es um Integrität: Handeln im Einklang mit den eigenen Werten und ehrliche Selbstbeurteilung.","Verträge, Entscheidungen, Streitfragen, Ehrlichkeit in Beziehungen.","Schatten: Härte im Urteil, Rechthaberei, Selbstverurteilung.","Prüfe eine offene Entscheidung anhand von Fakten und deiner Werte.","Wo habe ich mir selbst gegenüber nicht ganz fair gehandelt?"],
["Der Gehängte","ein Perspektivwechsel durch bewusstes Innehalten","Der Gehängte steht für Hingabe, Pause und Perspektivwechsel.","Ein Mann hängt kopfüber an einem lebenden Baum, gelassen und mit Heiligenschein. Gekreuzte Beine und Arme bilden ein Dreieck: Das Aufgeben von Kontrolle geschieht freiwillig.","Psychologisch beschreibt die Karte Reframing: Blockaden lösen sich oft, wenn man die Sichtweise ändert.","Warten, Entscheidungen aussetzen, Dinge anders betrachten.","Schatten: Stillstand aus Angst, Märtyrerhaltung, vermeidendes Warten.","Betrachte ein festgefahrenes Problem heute aus der Sicht einer anderen Person.","Was sehe ich anders, wenn ich es auf den Kopf stelle?"],
["Der Tod","Abschluss und Wandlung, das Ende als Voraussetzung für Neues","Der Tod steht selten für körperlichen Tod, sondern für Ende, Transformation und Neuanfang.","Ein Skelett in Rüstung reitet auf weißem Pferd; König, Bischof und Kind sind gleichermaßen betroffen. Die schwarze Fahne mit weißer Rose zeigt Schönheit im Wandel, die aufgehende Sonne zwischen den Türmen den neuen Tag.","Er beschreibt Trauerarbeit und Loslassen: das bewusste Beenden von Rollen, Gewohnheiten oder Beziehungen.","Abschiede, Jobwechsel, Umzug, Gewohnheiten, die ausgedient haben.","Schatten: Festhalten, Angst vor Veränderung, Verdrängen von Trauer.","Benenne etwas, das dir nicht mehr dient, und plane einen kleinen Abschluss.","Was darf enden, damit Platz entsteht?"],
["Mäßigkeit","Balance, Geduld und die richtige Mischung","Mäßigkeit steht für Ausgleich, Maß, Heilung und Geduld.","Ein Engel gießt Wasser zwischen zwei Kelchen hin und her, ein Fuß steht am Land, einer im Wasser: Verbindung von Bewusstem und Unbewusstem. Iris und der Weg zur Krone am Horizont stehen für Hoffnung und Ziel.","Gemeint sind Integration und Resilienz: Gegensätze verbinden, in kleinen Schritten.","Work-Life-Balance, Ernährung, Schlaf, Kompromisse.","Schatten: Maßlosigkeit, Ungeduld, Zerrissenheit.","Gleiche heute bewusst aus: Wenn du viel gearbeitet hast, plane etwas Leichtes.","Was würde Balance in meinem Alltag konkret bedeuten?"],
["Der Teufel","Bindungen, Abhängigkeiten und selbst gewählte Fesseln","Der Teufel steht für Abhängigkeit, Versuchung, Materialismus und verdrängte Schattenanteile.","Ein gehörnter Dämon thront über zwei angeketteten Gestalten. Die Ketten sind locker, sie könnten sie abnehmen. Hörner und Fackel verweisen auf Triebe.","Psychologisch geht es um Gewohnheiten, Sucht und unbewusste Muster, die sich selbst verstärken.","Handy, Konsum, ungesunde Beziehungen, Perfektionismus.","Schatten ist Selbstbetrug: so zu tun, als hätte man keine Wahl.","Notiere ein Muster, das dich bindet, und überlege einen Mini-Schritt zur Lockerung.","Wo sind meine Ketten lockerer, als ich denke?"],
["Der Turm","ein plötzlicher Umbruch, der Unhaltbares offenlegt","Der Turm steht für den Zusammenbruch falscher Sicherheiten, für Erkenntnis und Befreiung.","Ein Blitz schlägt in die Krone eines Turms, Menschen stürzen, Flammen fallen. Die 22 Flammen verweisen auf die Zahl der Großen Arkana.","Er steht für Krisen, die Illusionen zerstören, und für Wachstum nach Belastung.","Kündigungen, Trennungen, Umbrüche, unerwartete Nachrichten.","Schatten: Katastrophisieren, Zerstörungswut, Angst vor Veränderung.","Prüfe, welche Konstruktion in deinem Leben auf wackligem Fundament steht, und stütze sie rechtzeitig.","Welche Wahrheit habe ich zu lange vermieden?"],
["Der Stern","Hoffnung, Heilung und ruhige Zuversicht","Der Stern steht für Hoffnung, Erneuerung, Inspiration und Ruhe nach der Krise.","Eine nackte Frau gießt Wasser auf Land und in einen Teich: Geben und Aufnehmen. Ein großer Stern, umgeben von sieben kleineren, leuchtet über ihr; ein Ibis sitzt im Baum.","Er beschreibt Resilienz, Optimismus und das Vertrauen, dass Erholung möglich ist.","Erholung, Ziele, Visionen, Dankbarkeit.","Schatten: Wunschdenken, Passivität, Enttäuschung.","Schreibe drei Dinge auf, für die du dankbar bist, und ein Ziel, das dich anzieht.","Was gibt mir gerade leise Hoffnung?"],
["Der Mond","Unsicherheit, Träume und das Unbewusste","Der Mond steht für Illusion, Angst, Intuition und das Unbewusste.","Ein Hund und ein Wolf heulen den Mond an, ein Krebs steigt aus dem Wasser, ein Pfad führt zwischen zwei Türmen in die Ferne. Alles liegt im Zwielicht.","Er steht für Projektionen, Ängste und Träume: Dinge sind nicht eindeutig.","Verwirrende Situationen, Schlafprobleme, Zukunftsängste.","Schatten: Täuschung, Paranoia, Selbstbetrug.","Warte mit wichtigen Entscheidungen, bis es heller wird, und sammle Fakten statt Vermutungen.","Welche Angst wirkt größer, als sie ist?"],
["Die Sonne","Klarheit, Lebensfreude und Erfolg","Die Sonne steht für Freude, Vitalität, Erfolg und Klarheit.","Ein nacktes Kind reitet auf weißem Pferd vor Sonnenblumen unter strahlender Sonne: Unschuld, Wärme, Wachstum. Die rote Fahne steht für Lebenskraft.","Sie beschreibt Selbstwert, Zufriedenheit und spielerische Lebensfreude.","Erfolgserlebnisse, Gesundheit, gute Zeit mit Familie und Freunden.","Schatten: Übermut, Oberflächlichkeit, Erschöpfung durch Dauerstrahlen.","Genieße heute bewusst ein Erfolgserlebnis, auch ein kleines.","Was bringt mich zum Strahlen?"],
["Das Gericht","der Ruf zur Erneuerung und eine ehrliche Bilanz","Das Gericht steht für Erwachen, Rechenschaft und Neubeginn aus Erkenntnis.","Ein Engel bläst die Posaune, Menschen erheben sich aus Särgen auf einem Meer. Die Szene erinnert an das Jüngste Gericht, hier eher als inneres Aufrufen zu verstehen.","Es geht um Selbstreflexion, Vergebung und Berufung: Wer will ich sein?","Lebensbilanz, Neuorientierung, Entscheidungen, die zu mir passen.","Schatten: Selbstverurteilung, Zögern, Verdrängung.","Ziehe eine ehrliche Zwischenbilanz: Was hat funktioniert, was möchte ich ändern?","Welchem Ruf folge ich noch nicht?"],
["Die Welt","Vollendung und das Gefühl, dass sich ein Kreis schließt","Die Welt steht für Abschluss, Ganzheit und Integration.","Eine tanzende Gestalt steht in einem Lorbeerkranz, umgeben von den vier geflügelten Wesen. Der Kranz steht für Sieg, der Tanz für Leichtigkeit, die vier Wesen für Vollständigkeit.","Sie beschreibt die Integration aller Persönlichkeitsanteile und das Erreichen eines Ziels.","Abschlüsse, Reisen, erreichte Ziele, neue Zyklen.","Schatten: Stillstand nach dem Ziel, Perfektionismus, Angst vor dem Danach.","Feiere einen abgeschlossenen Schritt, bevor du den nächsten planst.","Was ist eigentlich schon vollendet, und habe ich es gewürdigt?"]];

var HTE=["Heute tritt deine Fähigkeit in den Vordergrund, Dinge nicht nur zu sehen, sondern zu durchschauen. Skorpion-Energie bedeutet Tiefe statt Oberfläche: Du spürst, was unausgesprochen im Raum liegt. Nutze das, um Prioritäten zu klären.","Der Tag trägt eine ruhige, konzentrierte Grundschwingung. Weniger Aktivität, mehr Wirkung: Was du heute mit voller Aufmerksamkeit erledigst, hält länger als vieles, das du nebenbei erledigst.","Eine Mischung aus Antrieb und Zurückhaltung prägt den Tag. Du hast mehr Kraft, als du zeigst. Überlege, wofür du sie einsetzen willst, bevor du sie verteilst.","Heute geht es um Wandlung im Kleinen: eine Gewohnheit anpassen, ein Gespräch anders führen, einen alten Standpunkt prüfen. Skorpion verbindet Intensität mit Erneuerung.","Die Energie des Tages begünstigt Gründlichkeit. Details, die sonst untergehen, bekommen Bedeutung. Lass dir Zeit mit Entscheidungen, die du nicht rückgängig machen kannst."];
var HEM=["Emotional bist du heute empfindsamer als gewohnt. Die dritte Dekade verleiht dem Skorpion eine weiche, schützende Seite: Du spürst Stimmungen anderer früh. Achte darauf, fremde Gefühle nicht mit deinen eigenen zu verwechseln.","Du erlebst Gefühle in Wellen. Wenn eine Unruhe aufkommt, hilft es, sie zu benennen, statt sie zu analysieren. Ein Spaziergang oder Musik kann Spannungen lösen.","Nähe und Rückzug halten sich heute die Waage. Du brauchst Momente für dich, ohne dich abzukapseln. Sprich das ruhig aus.","Alte Gefühle können kurz hochkommen. Das ist kein Rückschritt, sondern ein Zeichen, dass etwas verarbeitet werden will. Behandle dich wie einen guten Freund.","Eine stille Zuversicht trägt dich. Gerade weil du Tiefe kennst, kannst du Leichtigkeit heute besonders genießen."];
var HEB=["Im Gespräch zählt heute Zuhören mehr als Überzeugen. Frage nach, bevor du schlussfolgerst: Skorpion erkennt oft viel, liegt aber nicht immer richtig. Eine ruhige Rückfrage kann ein Missverständnis verhindern.","Vertrauen entsteht durch Verlässlichkeit im Kleinen. Eine kurze Nachricht an jemanden, den du länger nicht gesprochen hast, kann mehr bewirken als ein großes Wort.","In Beziehungen sind Grenzen wichtig. Du darfst Nein sagen, ohne dich zu rechtfertigen, und aussprechen, was dir fehlt, ohne Vorwurf.","Intensität ist eine Stärke, wirkt aber manchmal fordernd. Gib anderen Raum, in ihrem Tempo zu antworten.","Humor und Leichtigkeit lockern heute auch ernste Themen. Ein gemeinsames Lachen kann mehr klären als eine lange Erklärung."];
var HEJ=["Beruflich bringt dich Konzentration auf eine Sache weiter als Multitasking. Plane einen Block ungestörter Arbeit und schalte Benachrichtigungen aus.","Der Alltag belohnt Ordnung: Ein aufgeräumter Schreibtisch, eine klare Liste mit drei Prioritäten und feste Pausen entlasten Kopf und Energie.","Gut geeignet für Recherche, Analyse und Fehlersuche. Dein Blick für Details und Zusammenhänge ist heute besonders klar.","Zeige Ergebnisse, nicht nur Pläne. Ein kleiner sichtbarer Fortschritt motiviert dich und andere mehr als ein perfektes Konzept.","Organisatorisches, das du aufgeschoben hast, etwa Anrufe, Formulare oder Termine, geht heute überraschend leicht von der Hand."];
var HEE=["Persönliche Entwicklung bedeutet heute, eine alte Überzeugung zu prüfen: Gilt sie noch, oder ist sie nur Gewohnheit? Schreibe sie auf und frage, was dagegen spricht.","Lerne etwas, das deine Neugier weckt, nicht nur Nützliches. Skorpion wächst, wo Interesse und Tiefe zusammenkommen.","Dein Wachstum liegt gerade im Loslassen von Kontrolle. Vertraue darauf, dass nicht alles durch dich gesteuert werden muss.","Selbstreflexion gelingt am besten schriftlich. Drei Sätze zu: Was hat mich heute bewegt? reichen völlig.","Kleine Routinen formen dich mehr als große Vorsätze. Wähle eine, die du heute und morgen leicht wiederholen kannst."];
var HEH=["Herausfordernd kann Misstrauen sein: Du neigst dazu, Hintergedanken zu vermuten. Prüfe Annahmen, bevor du handelst.","Die Gefahr liegt im Grübeln. Wenn ein Gedanke zum dritten Mal kreist, hilft Handeln oder Bewegung mehr als weiteres Nachdenken.","Ungeduld mit anderen oder dir selbst könnte aufkommen. Eine Pause von zehn Minuten wirkt oft Wunder.","Perfektionismus bremst. Gut genug ist heute oft das bessere Ziel.","Zu viel Verantwortung für die Gefühle anderer zu übernehmen kann erschöpfen. Du darfst Hilfe begrenzen."];
var HEC=["Ein Gespräch, das du für schwierig hältst, kann sich als klärend und verbindend erweisen.","Deine Ausdauer macht aus einem zähen Projekt etwas Vorzeigbares. Bleib dran.","Eine Information, die du zufällig bekommst, passt zu einem offenen Thema. Halte die Ohren offen.","Rückzug und Ruhe laden deine Energie schneller auf als sonst.","Wenn du dich zeigst, wie du bist, entsteht Vertrauen schneller als durch Perfektion."];

var PSY=[
["Bestätigungsfehler","Kognitive Verzerrung","Wir suchen, deuten und erinnern Informationen bevorzugt so, dass sie unsere bestehende Meinung stützen. Der Begriff geht auf Forschung von Peter Wason aus den 1960er-Jahren zurück.","In Wasons 2-4-6-Aufgabe testeten Teilnehmer ihre Regelvermutung fast nur mit Beispielen, die sie bestätigen sollten, statt mit solchen, die sie widerlegen könnten. Passende Informationen werden als glaubwürdiger bewertet und weniger streng geprüft.","Widersprüche erzeugen kognitive Dissonanz, die unangenehm ist. Bestätigung spart Denkaufwand und schützt das Selbstbild.","Im Netz klicken wir eher Quellen an, die uns recht geben, und Empfehlungsalgorithmen verstärken das. Auch im Streit hören wir selektiv zu.","Suche aktiv nach der besten Gegenposition und frage: Welche Beobachtung würde mich überzeugen, dass ich falsch liege?","Denkaufgabe: Nenne eine Überzeugung, die du für sicher hältst, und formuliere ihr stärkstes Gegenargument."],
["Dunning-Kruger-Effekt","Selbstwahrnehmung","1999 zeigten David Dunning und Justin Kruger, dass Personen mit geringer Kompetenz in einem Bereich ihre Leistung oft deutlich überschätzen.","Die Fähigkeiten, die man für gute Leistung braucht, braucht man auch, um Fehler zu erkennen. Wem das Wissen fehlt, dem fehlt auch der Maßstab. In den Studien lagen die schwächsten Teilnehmer weit über ihrer tatsächlichen Platzierung, Spitzenleute schätzten sich eher leicht zu niedrig ein.","Selbsteinschätzung beruht auf Eindrücken, nicht auf Messung; ohne Feedback bleibt die Lücke unsichtbar. Teile der Effektgröße werden in der Forschung auch als statistisches Artefakt diskutiert.","Beim Selbstbewusstsein im ersten Lernmonat oder bei Meinungen von Fachfremden zu schwierigen Themen.","Hole früh Feedback und miss Fortschritt mit externen Maßstäben statt mit Gefühl.","Denkaufgabe: In welchem Bereich überschätze ich mein Wissen am ehesten, und wie könnte ich das testen?"],
["Ankereffekt","Entscheidungsverzerrung","Eine zuerst genannte Zahl beeinflusst spätere Schätzungen, auch wenn sie offensichtlich irrelevant ist.","Tversky und Kahneman ließen 1974 ein Glücksrad drehen (10 oder 65) und fragten dann nach dem Anteil afrikanischer Staaten in der UNO. Die Mediane der Schätzungen lagen bei etwa 25 beziehungsweise 45 Prozent. Wir passen uns vom Anker aus nur unzureichend an.","Das Gehirn nutzt verfügbare Zahlen als Startpunkt und stoppt die Anpassung, sobald ein plausibler Wert erreicht ist.","Streichpreise im Handel, Gehaltsverhandlungen, Immobilienpreise: Die erste Zahl am Tisch prägt das Ergebnis.","Bilde vor Verhandlungen eigene Referenzwerte und setze, wenn möglich, selbst den ersten Anker.","Denkaufgabe: Welche Preise oder Zahlen beeinflussen mich beim nächsten Kauf, ohne dass ich es merke?"],
["Unaufmerksamkeitsblindheit","Wahrnehmung","Wir übersehen auffällige, aber unerwartete Dinge, wenn unsere Aufmerksamkeit auf etwas anderes gerichtet ist.","Im Experiment von Simons und Chabris (1999) zählten Teilnehmer die Ballpässe eines Teams in Weiß. Etwa die Hälfte bemerkte eine Person im Gorillakostüm nicht, die mitten durchs Bild lief. Aufmerksamkeit ist ein enger Scheinwerfer.","Das Gehirn filtert, um Überlastung zu vermeiden. Was nicht zur Aufgabe passt, wird früh aussortiert.","Beim Autofahren mit Telefonieren, beim Lesen im Café oder beim Suchen eines Gegenstands, der direkt vor einem liegt.","Unser Eindruck, die Umgebung vollständig zu sehen, ist eine Illusion. Wichtiges braucht bewusste Aufmerksamkeit.","Denkaufgabe: Was ist auf deinem Weg heute passiert, das du nicht bemerkt hast? Beobachte beim nächsten Mal bewusst."],
["Halo-Effekt","Urteilsfehler","Ein positiver Eindruck in einem Bereich färbt unser Urteil über andere Eigenschaften ab.","Edward Thorndike beschrieb den Effekt 1920 bei Offizieren: Wer als gutaussehend galt, wurde auch als intelligenter und zuverlässiger beurteilt. Das Gehirn bildet schnell ein Gesamtbild und glättet Widersprüche.","Stimmige Urteile fühlen sich richtig an und sparen Denkaufwand.","Sympathische Menschen gelten als kompetenter, bekannte Marken als besser, und der Ersteindruck prägt die Bewertung von Kollegen.","Bewerte Eigenschaften getrennt, am besten anhand konkreter Kriterien und Beispiele.","Denkaufgabe: Wen halte ich für kompetent, nur weil ich ihn sympathisch finde?"],
["Das Schiff des Theseus","Philosophie der Identität","Ein Gedankenexperiment aus der Antike, überliefert von Plutarch: Wenn alle Planken eines Schiffes nach und nach ersetzt werden, ist es dann noch dasselbe Schiff?","Es prüft, was Identität ausmacht: Material, Form, Funktion oder Geschichte. Thomas Hobbes erweiterte es: Was, wenn jemand aus den alten Planken ein zweites Schiff baut?","Wir erleben uns als dieselbe Person, obwohl sich Zellen, Gewohnheiten und Überzeugungen ständig ändern.","Bei Fragen wie: Bin ich noch derselbe wie vor zehn Jahren? Ist eine Software, deren Code komplett neu geschrieben wurde, noch dasselbe Produkt?","Identität ist vielleicht weniger ein Ding als ein fortlaufendes Muster aus Erinnerung und Zusammenhang.","Denkaufgabe: Welche Teile von mir könnten sich ändern, ohne dass ich aufhöre, ich zu sein?"],
["Das Trolley-Problem","Moralphilosophie","Ein Dilemma, das Philippa Foot 1967 formulierte: Eine Weiche umstellen, um fünf Menschen zu retten und dabei einen zu opfern?","Judith Jarvis Thomson variierte es: Soll man einen Menschen von einer Brücke stoßen, um fünf zu retten? Die meisten stimmen dem Umlegen der Weiche zu, lehnen das Stoßen aber ab, obwohl das Ergebnis gleich ist.","Vermutlich konkurrieren emotionale Intuitionen (direkte Gewalt ist abstoßend) mit dem rationalen Abwägen von Folgen.","Es spiegelt sich in Debatten über autonomes Fahren, Triage in der Medizin oder Ressourcenverteilung.","Moralische Urteile sind selten rein logisch. Explizite Prinzipien helfen, Widersprüche in den eigenen Entscheidungen zu bemerken.","Denkaufgabe: Gibt es einen moralischen Unterschied zwischen Tun und Geschehenlassen?"],
["Sunk-Cost-Fehlschluss","Entscheidungsverzerrung","Wir halten an Entscheidungen fest, weil wir bereits Zeit, Geld oder Mühe investiert haben, nicht weil sich die Zukunft lohnt.","Rational zählen nur künftige Kosten und Nutzen. Emotional wollen wir Verlust vermeiden und konsequent wirken. Arkes und Blumer fanden 1985, dass Käufer von Theater-Abos zum vollen Preis in der ersten Saisonhälfte mehr Vorstellungen besuchten als Käufer mit Rabatt.","Verluste wiegen emotional schwerer als gleich große Gewinne (Verlustaversion).","Der schlechte Film, den man zu Ende sieht; das Studium oder Projekt, das nicht mehr passt; die Beziehung nach so vielen Jahren.","Frage dich: Würde ich heute, mit allem Wissen, noch einmal damit anfangen?","Denkaufgabe: Wo investiere ich gerade weiter, nur weil ich schon so viel investiert habe?"],
["Marshmallow-Test","Selbstkontrolle","Walter Mischel ließ in den 1960er-/70er-Jahren Kinder wählen: ein Marshmallow sofort oder zwei, wenn sie etwa 15 Minuten warten.","Frühe Nachfolgestudien deuteten an, dass Kinder, die warten konnten, später bessere Schulleistungen hatten. Eine Replikation von Watts, Duncan und Quan (2018) mit größerer, vielfältigerer Stichprobe fand einen deutlich kleineren Zusammenhang, der stark vom familiären Hintergrund abhing.","Warten hängt auch von Vertrauen ab: Wer erlebt hat, dass Versprechen gebrochen werden, nimmt lieber sofort.","Sparen oder Konsum, Training oder Sofa, Lernen oder Ablenkung.","Selbstkontrolle lässt sich mit Strategien stärken: Ablenkung, Umgebung gestalten, Wenn-dann-Pläne.","Denkaufgabe: Welche Umgebungsänderung würde mir morgen das Warten leichter machen?"],
["Zuschauereffekt","Sozialpsychologie","Je mehr Personen anwesend sind, desto seltener hilft die einzelne Person.","Darley und Latané ließen 1968 Probanden über eine Gegensprechanlage einen vermeintlichen Anfall mithören. Wer allein war, half fast immer, in größeren Gruppen deutlich seltener. Verantwortung verteilt sich, und man orientiert sich an der Passivität der anderen.","Verantwortungsdiffusion und soziale Bewertung: Man will nicht falsch reagieren. Der oft erzählte Fall Kitty Genovese wurde später als stark überzeichnet erkannt.","Bei Notfällen in Menschenmengen, aber auch in Teams: Das macht schon jemand.","Sprich eine Person direkt an: Sie im blauen Pullover, rufen Sie bitte den Notruf. Konkrete Zuweisung durchbricht den Effekt.","Denkaufgabe: Wann habe ich zuletzt etwas nicht getan, weil ich dachte, jemand anderes macht es?"],
["Das Höhlengleichnis","Platon, Erkenntnistheorie","Im siebten Buch der Politeia beschreibt Platon Gefangene, die nur Schatten an einer Höhlenwand sehen und diese für die Wirklichkeit halten.","Wer befreit wird, muss mühsam lernen, Licht und Gegenstände zu erkennen. Zurückgekehrt, wird er verspottet. Das Gleichnis beschreibt Erkenntnis als Weg und die Schwierigkeit, Gewohntes zu hinterfragen.","Wir halten vertraute Weltbilder für selbstverständlich, weil sie Orientierung geben.","Filterblasen, Gruppenüberzeugungen, Berufsblindheit: Wir sehen vor allem, was in unserer Höhle sichtbar ist.","Fremde Perspektiven sind keine Bedrohung, sondern ein Werkzeug, um blinde Flecken zu finden.","Denkaufgabe: Welche Schatten halte ich für die ganze Wirklichkeit?"],
["Spotlight-Effekt","Selbstwahrnehmung","Wir überschätzen, wie stark andere uns beachten.","Gilovich und Kollegen ließen Studierende ein peinliches T-Shirt mit einem Porträt von Barry Manilow tragen und einen Raum betreten. Die Träger schätzten, etwa die Hälfte der Anwesenden habe es bemerkt; tatsächlich war es nur etwa ein Viertel.","Wir erleben uns selbst im Zentrum unserer Wahrnehmung; andere beschäftigen sich vor allem mit sich selbst.","Vor Präsentationen, nach Fehlern oder beim Betreten eines Raums.","Die meisten Menschen denken weniger über deine Patzer nach, als du glaubst. Das entlastet.","Denkaufgabe: Was habe ich unterlassen, weil ich dachte, alle würden darauf achten?"],
["Hedonische Anpassung","Wohlbefinden","Wir gewöhnen uns an positive wie negative Veränderungen und kehren zu einem gewohnten Zufriedenheitsniveau zurück.","Brickman, Coates und Janoff-Bulman verglichen 1978 Lottogewinner und Unfallopfer; die Unterschiede in der Alltagszufriedenheit waren geringer als erwartet. Spätere Forschung zeigt, dass die Anpassung nicht bei allem vollständig ist.","Wahrnehmung reagiert auf Veränderungen, nicht auf Dauerzustände. Das ist biologisch sinnvoll.","Das neue Smartphone, das Auto oder das Gehalt fühlen sich nach Wochen normal an.","Erlebnisse, Beziehungen und Gewohnheiten schaffen oft dauerhaftere Zufriedenheit als Besitz; Dankbarkeit bremst die Gewöhnung.","Denkaufgabe: Was habe ich, das ich mir einmal sehnlich gewünscht habe und kaum noch bemerke?"],
["Verfügbarkeitsheuristik","Urteilsfehler","Wir schätzen Wahrscheinlichkeiten danach ein, wie leicht uns Beispiele einfallen.","Tversky und Kahneman zeigten 1973: Wörter, die mit r beginnen, werden für häufiger gehalten als solche mit r an dritter Stelle, obwohl es umgekehrt ist. Eindrückliche, aktuelle Bilder dominieren die Schätzung.","Leichtes Erinnern signalisiert dem Gehirn: Das kommt oft vor.","Flugangst nach Berichten über Abstürze trotz geringem Risiko; Überschätzung von Kriminalität durch Medienberichte.","Frage: Welche Zahlen gibt es dazu? Nachrichtenlage ist nicht gleich Häufigkeit.","Denkaufgabe: Wovor habe ich mehr Angst als statistisch nötig, und wovor zu wenig?"],
["Das Chinesische Zimmer","Philosophie des Geistes","John Searle (1980): Eine Person im Zimmer folgt Regeln, um chinesische Zeichen zu beantworten, ohne Chinesisch zu verstehen.","Searle argumentiert, dass bloßes Regelbefolgen (Syntax) kein Verstehen (Semantik) erzeugt, selbst wenn die Antworten überzeugend wirken. Kritiker entgegnen mit dem Systemargument, dass das Gesamtsystem verstehen könnte.","Es berührt die Frage, ob Verhalten allein Bewusstsein oder Verstehen beweist.","Aktuell in Debatten über KI-Sprachmodelle.","Wir beurteilen Verständnis meist am Verhalten, ein unsicherer Maßstab.","Denkaufgabe: Woran würdest du erkennen, ob etwas wirklich versteht?"],
["Framing-Effekt","Entscheidungsverzerrung","Dieselbe Information führt zu anderen Entscheidungen, je nachdem, wie sie formuliert ist.","Im Asiatische-Krankheit-Problem (Tversky und Kahneman, 1981) wählten 72 Prozent ein Programm, das 200 von 600 Menschen sicher rettet, aber nur 22 Prozent, wenn dieselbe Option als 400 Menschen sterben formuliert war.","Wir sind bei Gewinnen eher risikoscheu und bei Verlusten eher risikobereit (Prospect Theory).","90 Prozent fettfrei statt 10 Prozent Fett; Rabatt statt Aufpreis.","Formuliere Entscheidungen um und prüfe, ob sie gleich bleiben.","Denkaufgabe: Wie würde sich mein Urteil ändern, wenn ich das Problem als Verlust statt als Gewinn beschriebe?"]];

["Der Linux-Kernel","Open Source","Am 25. August 1991 kündigte der finnische Student Linus Torvalds ein freies Betriebssystem als Hobby an. Heute läuft der Kernel auf Smartphones, Routern, Servern und seit 2017 auf allen Systemen der TOP500-Supercomputerliste. Auch Android baut auf einem angepassten Linux-Kernel auf.","Entwickelt wird er von tausenden Freiwilligen und Firmen; neue Versionen erscheinen etwa alle neun bis zehn Wochen. Dahinter steht ein hierarchisches Maintainer-System.","Kernel: Der Kern eines Betriebssystems, der Hardware, Speicher und Prozesse verwaltet."],
["Linux-Distributionen","Linux","Eine Distribution bündelt Kernel, Systemwerkzeuge und Anwendungen. Debian (seit 1993) gilt als stabil und ist Basis für Ubuntu und Raspberry Pi OS. Fedora liefert aktuelle Technik. Arch Linux ist ein Baukasten für Selbermacher.","Unterschiede zeigen sich bei Paketverwaltung (apt, dnf, pacman), Update-Rhythmus und Philosophie. Für Einsteiger sind Ubuntu, Linux Mint oder Fedora Workstation gängige Wege.","Rolling Release: Es gibt keine großen Versionssprünge; Software wird laufend aktualisiert."],
["Open-Source-Lizenzen","Open Source","Quelltext ist offen, aber nicht alles ist gleich frei. Die GPL verlangt, dass abgeleitete Werke ebenfalls offen bleiben (Copyleft). MIT- und BSD-Lizenzen erlauben fast alles, auch den Einsatz in proprietärer Software.","Freie Software betont Nutzerfreiheiten (nutzen, studieren, teilen, verbessern); Open Source betont die Entwicklungsvorteile offenen Codes. Beides überlappt stark.","Copyleft: Lizenzprinzip, das die Freiheit an Weitergaben bindet."],
["Dein Tablet: MediaTek MT8176","Hardware","Das Xiaomi Mi Pad 3 nutzt den MediaTek MT8176 mit sechs Kernen: zwei leistungsstarke Cortex-A72 und vier sparsame Cortex-A53, dazu eine PowerVR-GX6250-Grafik und ein 7,9-Zoll-Display mit 2048 mal 1536 Pixeln.","Diese Aufteilung heißt big.LITTLE. Für flüssige Animationen zählt vor allem die GPU: Bewegungen über transform und opacity werden von ihr übernommen, Layout- und Filteroperationen belasten dagegen die CPU.","big.LITTLE: Kombination aus schnellen und effizienten CPU-Kernen im selben Chip."],
["Chipsätze und Fertigung","Hardware","Ein System-on-a-Chip (SoC) vereint CPU, GPU, Modem, Signalprozessor für Kameras und oft KI-Beschleuniger auf einem Stück Silizium. Bekannte Familien sind Qualcomm Snapdragon, MediaTek Dimensity, Apple A- und M-Serie sowie Google Tensor.","Die Nanometer-Angaben (etwa 3 nm) sind heute eher Marketingnamen von Fertigungsgenerationen als Messwerte einzelner Strukturen. Wichtiger sind Transistordichte, Energieeffizienz und Architektur.","SoC: System on a Chip, ein Chip, der ein ganzes Gerät steuert."],
["Custom ROMs und LineageOS","Android","LineageOS entstand 2016 nach dem Ende von CyanogenMod und bietet aktualisierte Android-Versionen für viele ältere Geräte. Es kommt ohne viel Vorinstalliertes aus und ist ein beliebter Weg, ältere Hardware länger zu nutzen.","Voraussetzung ist meist ein entsperrbarer Bootloader. Projekt Treble (seit Android 8) trennt Herstellertreiber vom Android-System und erleichtert Updates. Nachteile können Verlust der Garantie oder Einschränkungen bei Banking-Apps sein.","Bootloader: Das erste Programm beim Start, das das Betriebssystem lädt."],
["Datenschutz im Alltag","Datenschutz","Seit 25. Mai 2018 gilt die EU-Datenschutz-Grundverordnung. Praktisch helfen Ende-zu-Ende-verschlüsselte Messenger, Tracker-Blocker, DNS-over-HTTPS und weniger Konten bei Diensten, die man nicht braucht.","Auch Metadaten (wer wann mit wem kommuniziert) sind aussagekräftig. Datensparsamkeit ist die wirksamste Maßnahme: Was nicht gespeichert wird, kann nicht verloren gehen.","Ende-zu-Ende-Verschlüsselung: Nur Sender und Empfänger können Nachrichten lesen."],
["Passkeys statt Passwörter","IT-Sicherheit","Passkeys basieren auf FIDO2/WebAuthn und ersetzen Passwörter durch Schlüsselpaare: Der private Schlüssel bleibt auf deinem Gerät, die Website erhält nur den öffentlichen. Anmeldung erfolgt per Fingerabdruck, Gesicht oder PIN.","Weil nichts Geheimes übertragen wird, sind Passkeys resistent gegen Phishing und Datenlecks bei Diensten. Bis zur Verbreitung bleiben Passwortmanager und Zwei-Faktor-Anmeldung die wichtigsten Schutzmaßnahmen.","Phishing: Betrug, bei dem Zugangsdaten über gefälschte Seiten erschlichen werden."],
["Android 7 im Dauerbetrieb","IT-Sicherheit","Dein Tablet läuft mit Android 7, das keine regulären Sicherheitsupdates mehr erhält. Entscheidend ist deshalb ein aktueller Browser beziehungsweise WebView über den Play Store, denn dort liegt die größte Angriffsfläche.","Betreibe das Gerät nur in vertrauenswürdigen Netzen, melde nur Dienste mit eigenem Zugang an und nutze keine sensiblen Konten darauf. Für ein Wand-Dashboard mit wenigen Konten ist das Risiko überschaubar.","WebView: Die Browser-Komponente, mit der Apps Webseiten darstellen."],
["Wayland und X11","Linux","X11 stammt aus den 1980er-Jahren und trennt Anzeige-Server, Fensterverwaltung und Anwendungen. Wayland vereint diese Aufgaben im sogenannten Compositor und setzt auf moderne Grafiktechnik; es gilt als sicherer und flüssiger.","Bei X11 kann jedes Programm Eingaben anderer mitlesen, bei Wayland ist das standardmäßig getrennt. Manche Altsoftware und Screenshots brauchen Zwischenschichten wie XWayland.","Compositor: Programm, das Fensterinhalte zusammensetzt und auf den Bildschirm bringt."],
["Container wie Docker und Podman","Technologie","Container verpacken Programme samt ihren Abhängigkeiten. Anders als virtuelle Maschinen teilen sie sich den Kernel des Hostsystems und starten deshalb in Sekunden.","Isoliert wird mit Linux-Kernel-Funktionen: Namespaces trennen Sichtbarkeit von Prozessen und Netzwerk, cgroups begrenzen Ressourcen. Ein Image ist eine unveränderliche Vorlage, aus der Container entstehen.","Namespace: Kernel-Mechanismus, der Prozessen eine eigene Sicht auf Ressourcen gibt."],
["RISC-V","Prozessoren","RISC-V ist eine offene Befehlssatzarchitektur, die ab 2010 an der Universität Berkeley entstand. Hersteller können Chips ohne Lizenzgebühr für den Befehlssatz entwickeln.","Im Gegensatz zu x86 (Intel, AMD) oder ARM kann jeder die Spezifikation nutzen und erweitern. Zunehmend erscheinen RISC-V-Chips für Mikrocontroller, Entwicklerboards und erste Laptops.","Befehlssatz: Die Sprache, die ein Prozessor versteht."],
["Git","Open Source","Linus Torvalds entwickelte Git 2005, um den Linux-Kernel zu verwalten. Es speichert Versionsstände als Schnappschüsse, die über Prüfsummen identifiziert werden.","Weil jeder Klon die vollständige Historie enthält, funktioniert Git offline und ist robust. Branches sind billig, was parallele Entwicklung und Experimente erleichtert.","Commit: Ein gespeicherter Versionsstand mit Beschreibung."],
["HTTPS und Let's Encrypt","Datenschutz","Let's Encrypt startete 2015 öffentlich und stellt kostenlose Zertifikate bereit, wodurch HTTPS für kleine Websites selbstverständlich wurde.","TLS verschlüsselt die Verbindung und stellt über Zertifikate sicher, dass man mit dem richtigen Server spricht. Dein Dashboard braucht HTTPS auch für die Spotify-Anmeldung (PKCE).","TLS: Protokoll für verschlüsselte Datenübertragung im Internet."]];

var SPC=[
["Olympus Mons: der höchste Vulkan","Planeten","Olympus_Mons","Auf dem Mars liegt Olympus Mons, ein Schildvulkan mit rund 22 Kilometern Höhe über dem umgebenden Gelände und etwa 600 Kilometern Durchmesser.","Der Mars hat geringere Schwerkraft (etwa 38 Prozent der Erde) und keine Plattentektonik. Lava konnte deshalb lange an derselben Stelle austreten und den Vulkan immer weiter aufbauen.","Zum Vergleich: Der Mount Everest ragt etwa 8,8 Kilometer über den Meeresspiegel. Olympus Mons wäre rund 2,5-mal so hoch.","Die Flanken sind so flach, dass man vom Rand aus den Gipfel wegen der Krümmung des Planeten nicht sehen könnte."],
["Schwarze Löcher im Bild","Schwarze Löcher","Schwarzes_Loch","2019 veröffentlichte das Event Horizon Telescope das erste Bild des Schattens eines Schwarzen Lochs im Zentrum der Galaxie M87, 2022 folgte Sagittarius A* im Zentrum unserer Milchstraße.","Das Netzwerk verbindet Radioteleskope rund um die Erde zu einem virtuellen Teleskop von Erdgröße (Interferometrie). Jede Station zeichnet Daten mit Atomuhren auf, die später zusammengeführt werden.","Der Schwarzschild-Radius r = 2GM/c² beträgt für die Sonne etwa 3 Kilometer. M87* hat etwa 6,5 Milliarden Sonnenmassen.","Zu sehen ist nicht das Loch selbst, sondern sein Schatten vor heißem, leuchtendem Gas."],
["Starlink: Internet aus dem All","Satelliten","Starlink","Starlink ist ein Satelliteninternet-System von SpaceX mit Tausenden Satelliten in niedriger Erdumlaufbahn, überwiegend in etwa 550 Kilometern Höhe.","Wegen der geringen Höhe liegen Signallaufzeiten typischerweise im Bereich von einigen zehn Millisekunden, viel niedriger als bei klassischen geostationären Satelliten in 35.786 Kilometern Höhe (über 500 Millisekunden). Neuere Satelliten tauschen Daten zusätzlich über optische Laserlinks untereinander aus.","Weil die Satelliten schnell über den Himmel ziehen, wechselt die Antenne laufend zum jeweils nächsten Satelliten.","Herausforderungen sind Weltraumschrott, Lichtverschmutzung für Astronomen und Kollisionsvermeidung."],
["Saturns Ringe","Planeten","Ringe_des_Saturn","Saturns Ringe spannen sich über mehr als 270.000 Kilometer, sind aber oft nur rund zehn Meter dick.","Sie bestehen überwiegend aus Wassereis-Teilchen von Staubkorn- bis Hausgröße. Daten der Raumsonde Cassini sprechen dafür, dass sie erdgeschichtlich vergleichsweise jung sein könnten. Das Alter ist aber weiter umstritten.","Ihr Durchmesser ist mehr als 20.000-mal so groß wie ihre Dicke.","Schon ein kleines Teleskop mit rund 20-facher Vergrößerung zeigt die Ringe."],
["James-Webb-Weltraumteleskop","Raumfahrtmissionen","James_Webb_Space_Telescope","Das James-Webb-Weltraumteleskop startete am 25. Dezember 2021 und beobachtet im Infrarotbereich.","Der Hauptspiegel aus 18 goldbeschichteten Berylliumsegmenten misst 6,5 Meter. Ein mehrlagiger Sonnenschild hält das Teleskop kalt, damit es schwache, stark rotverschobene Strahlung früher Galaxien erfasst.","Es steht am Lagrange-Punkt L2, etwa 1,5 Millionen Kilometer von der Erde entfernt, rund viermal weiter als der Mond.","Der Sonnenschild ist etwa so groß wie ein Tennisplatz."],
["Die Andromedagalaxie","Galaxien","Andromedagalaxie","Die Andromedagalaxie (M31) ist mit rund 2,5 Millionen Lichtjahren Entfernung die größte Nachbargalaxie der Milchstraße und unter dunklem Himmel mit bloßem Auge als schwacher Fleck sichtbar.","Sie nähert sich der Milchstraße mit etwa 110 Kilometern pro Sekunde. Eine Verschmelzung in einigen Milliarden Jahren gilt als wahrscheinlich, neuere Analysen halten den Zeitpunkt und die Sicherheit aber für unklarer als früher gedacht.","Das Licht, das du siehst, ist rund 2,5 Millionen Jahre unterwegs gewesen.","Sie enthält schätzungsweise rund eine Billion Sterne."],
["Neutronensterne","Sterne","Neutronenstern","Ein Neutronenstern ist der Überrest eines massereichen Sterns nach einer Supernova: etwa 1,4 bis 2 Sonnenmassen auf einem Durchmesser von rund 20 Kilometern.","Die Materie ist so dicht, dass Protonen und Elektronen weitgehend zu Neutronen verschmolzen sind. Pulsare sind schnell rotierende, magnetisierte Neutronensterne, deren Strahlung wie ein Leuchtturm periodisch auf die Erde trifft.","Ein Teelöffel Neutronensternmaterie hätte eine Masse von mehreren Milliarden Tonnen.","Der schnellste bekannte Pulsar, PSR J1748−2446ad, dreht sich etwa 716-mal pro Sekunde."],
["Voyager 1","Raumfahrtmissionen","Voyager_1","Voyager 1 startete 1977 und erreichte im August 2012 den interstellaren Raum, als erstes menschengemachtes Objekt.","Die Sonde fliegt mit rund 17 Kilometern pro Sekunde relativ zur Sonne und ist weit über 160 Astronomische Einheiten entfernt. Signale brauchen mehr als 20 Stunden. Ein Radionuklidgenerator versorgt sie, dessen Leistung langsam abnimmt, weshalb nach und nach Instrumente abgeschaltet werden.","An Bord ist die Golden Record mit Klängen und Bildern der Erde.","Ihre Computer stammen aus den 1970er-Jahren und haben winzige Speicher."],
["Die Internationale Raumstation","Raumfahrtmissionen","Internationale_Raumstation","Die ISS kreist in rund 400 Kilometern Höhe mit etwa 7,7 Kilometern pro Sekunde um die Erde.","Eine Erdumrundung dauert rund 92 Minuten, die Besatzung erlebt etwa 16 Sonnenaufgänge am Tag. Schwerelosigkeit entsteht durch ständigen freien Fall um die Erde: In 400 Kilometern Höhe wirkt noch rund 90 Prozent der Erdschwerkraft.","Mit bloßem Auge erscheint sie als helles, schnelles Licht, das über den Himmel zieht. Vorhersagen liefert zum Beispiel NASAs Spot the Station.","Sie ist seit November 2000 durchgehend bewohnt."],
["Exoplaneten","Astronomie","Exoplanet","Exoplaneten umkreisen andere Sterne. Der erste um einen sonnenähnlichen Stern wurde 1995 entdeckt (51 Pegasi b). Inzwischen sind über 6.000 bestätigt.","Gefunden werden sie vor allem mit der Transitmethode (kurzes Abdunkeln des Sterns) und der Radialgeschwindigkeitsmethode (Wackeln des Sterns). Die Kepler-Mission zeigte, dass Planeten bei Sternen eher die Regel als die Ausnahme sind.","Das TRAPPIST-1-System hat sieben erdgroße Planeten, drei davon in der habitablen Zone.","Mit dem James-Webb-Teleskop lassen sich erste Atmosphären kleiner Planeten spektroskopisch untersuchen."],
["Die Sonne","Sterne","Sonne","Die Sonne enthält etwa 99,86 Prozent der Masse des Sonnensystems.","Im Kern verschmilzt Wasserstoff bei rund 15 Millionen Grad Celsius zu Helium; pro Sekunde werden etwa vier Millionen Tonnen Masse in Energie umgewandelt.","Das Licht, das heute Mittag dein Gesicht erwärmt, hat die Sonne vor gut acht Minuten verlassen. Die Energie dahinter wurde im Kern allerdings vor Zehntausenden Jahren erzeugt, denn Photonen brauchen so lange bis zur Oberfläche.","Sie ist etwa 4,6 Milliarden Jahre alt und ungefähr in der Mitte ihres Lebens."],
["Gravitationswellen","Physik","Gravitationswelle","Am 14. September 2015 maßen die LIGO-Detektoren erstmals Gravitationswellen (GW150914), ausgelöst durch zwei verschmelzende Schwarze Löcher von rund 36 und 29 Sonnenmassen.","Gravitationswellen dehnen und stauchen den Raum minimal. LIGO misst Längenänderungen von etwa einem Tausendstel des Durchmessers eines Protons auf vier Kilometern Armlänge.","Dabei wurde die Energie von rund drei Sonnenmassen als Gravitationswellen abgestrahlt.","Der Physik-Nobelpreis 2017 ging an Rainer Weiss, Barry Barish und Kip Thorne."],
["Dunkle Materie und Dunkle Energie","Kosmologie","Dunkle_Materie","Gewöhnliche Materie macht nur etwa 5 Prozent des Energieinhalts des Universums aus; rund 27 Prozent entfallen auf Dunkle Materie und etwa 68 Prozent auf Dunkle Energie.","Hinweise auf Dunkle Materie liefern Rotationskurven von Galaxien, Gravitationslinsen und Strukturen im kosmischen Mikrowellenhintergrund. Ihre Natur ist unbekannt. Dunkle Energie beschleunigt die Expansion des Universums, entdeckt 1998 durch Supernova-Beobachtungen.","Sterne am Rand von Galaxien bewegen sich zu schnell, als dass die sichtbare Masse allein sie halten könnte.","Die Prozentwerte stammen vor allem aus Messungen der Planck-Mission."],
["Jupiter","Planeten","Jupiter_(Planet)","Jupiter ist mit dem elffachen Erddurchmesser der größte Planet. Der Große Rote Fleck ist ein Sturm, der größer als die Erde ist und seit mindestens dem 19. Jahrhundert beobachtet wird.","Der Fleck schrumpft allmählich, die Windgeschwindigkeiten an seinem Rand liegen bei über 400 Kilometern pro Stunde. Jupiter strahlt mehr Wärme ab, als er von der Sonne erhält.","Der Mond Ganymed ist größer als der Planet Merkur.","Ein Jupitertag dauert knapp zehn Stunden."]];

/* ---- Tagesfakt: [Frage, Erklärung, Wissenschaftlicher Hintergrund, Beispiel, Warum interessant] ---- */
var FKT=[
["Warum ist der Himmel blau?","Sonnenlicht enthält alle Farben. Die Gasmoleküle der Atmosphäre streuen kurzwelliges blaues Licht deutlich stärker als langwelliges rotes.","Rayleigh-Streuung hängt von der Wellenlänge ab (proportional zu 1/λ⁴). Blaues Licht um 450 Nanometer wird rund viermal stärker gestreut als rotes Licht um 650 Nanometer.","Bei Sonnenuntergang legt das Licht einen langen Weg durch die Atmosphäre zurück, das Blau ist dann weitgehend herausgestreut und Rot und Orange bleiben übrig.","Dieselbe Physik erklärt blauen Himmel, rote Sonnenuntergänge und warum Berge in der Ferne bläulich wirken."],
["Warum sind Flamingos rosa?","Flamingos werden rosa durch Farbstoffe in ihrer Nahrung, nicht von Geburt an: Küken sind grau.","Carotinoide aus Algen und kleinen Krebstieren werden in der Leber verarbeitet und in Federn, Haut und Schnabel eingelagert.","In Zoos bekommen Flamingos carotinoidhaltiges Futter, sonst würden sie blasser.","Der Effekt zeigt, wie direkt Ernährung die äußere Erscheinung beeinflussen kann."],
["Warum verdirbt Honig praktisch nie?","Honig enthält nur etwa 17 bis 18 Prozent Wasser, ist sauer und enthält antimikrobielle Stoffe.","Der geringe Wassergehalt entzieht Mikroben Wasser durch Osmose, der pH-Wert liegt bei etwa 3,5 bis 4,5, und das bienen­eigene Enzym Glucoseoxidase erzeugt kleine Mengen Wasserstoffperoxid.","Honig aus archäologischen Fundstätten gilt bei sachgemäßer Lagerung als noch genießbar, auch wenn er kristallisieren kann.","Das Phänomen verbindet Chemie, Biologie und Lebensmittelkonservierung."],
["Warum fühlt sich Metall kälter an als Holz?","Beide Materialien haben dieselbe Zimmertemperatur, doch Metall leitet Wärme viel besser von der Haut weg.","Entscheidend ist die Wärmeeindringfähigkeit: Die Hand verliert bei Metall in kurzer Zeit mehr Wärme, die Hautoberfläche kühlt stärker ab, und das nehmen die Wärmesensoren als kalt wahr.","Ein Metallgeländer fühlt sich im Winter wesentlich kälter an als ein Holzgeländer bei gleicher Temperatur.","Wir messen also nicht Temperatur, sondern Wärmefluss."],
["Sind Bananen radioaktiv?","Ja, in sehr geringem Maß, denn Bananen enthalten Kalium und ein winziger Anteil davon ist das radioaktive Isotop Kalium-40.","Kalium-40 macht etwa 0,012 Prozent des natürlichen Kaliums aus. Als Banane-Äquivalentdosis wird die Strahlenbelastung beim Verzehr einer Banane mit rund 0,1 Mikrosievert angesetzt.","Die natürliche Strahlenbelastung in Deutschland liegt im Mittel bei rund 2 bis 3 Millisievert pro Jahr, also tausenden Bananen.","Radioaktivität ist in der Natur allgegenwärtig; entscheidend ist die Dosis."],
["Kann ein Tier das Vakuum des Weltraums überleben?","Ja, Bärtierchen (Tardigraden) haben im Experiment ungeschützten Weltraum überlebt.","2007 überlebten Tardigraden im Experiment FOTON-M3 Vakuum und kosmische Strahlung. Sie fallen in einen Trockenstarre-Zustand, in dem der Stoffwechsel fast stillsteht; das Protein Dsup schützt in einer Art das Erbgut.","Die Tiere sind nur etwa 0,5 Millimeter groß und leben in Moos und Wasserfilmen.","Sie zeigen, wie weit Leben Grenzzustände ertragen kann, und liefern Ideen für Biologie und Medizin."],
["Warum merken wir nicht, dass sich die Erde dreht?","Die Erde dreht sich am Äquator mit rund 1.670 Kilometern pro Stunde, doch wir spüren das nicht.","Gleichmäßige Bewegung ohne Beschleunigung ist für unseren Körper nicht wahrnehmbar. Nur Änderungen der Geschwindigkeit, etwa Anfahren oder Bremsen, spüren wir.","Im Flugzeug spürt man bei gleichmäßigem Flug auch keine 900 Kilometer pro Stunde.","Die Erde bewegt sich zusätzlich mit rund 30 Kilometern pro Sekunde um die Sonne."],
["Warum werden Finger im Wasser schrumpelig?","Das Schrumpeln wird vom Nervensystem gesteuert: Blutgefäße in den Fingerspitzen ziehen sich zusammen und die Haut legt sich in Falten.","Eine Hypothese besagt, dass die Rillen den Griff auf nassen Gegenständen verbessern, ähnlich wie Reifenprofil. Studien dazu sind uneinheitlich, der Effekt ist also noch nicht abschließend geklärt.","Bei Menschen mit bestimmten Nervenschäden bleibt das Schrumpeln aus.","Ein alltägliches Phänomen, das noch offene wissenschaftliche Fragen enthält."],
["Wie intelligent sind Kraken?","Kraken haben drei Herzen, blaues Blut und ein verteiltes Nervensystem.","Das Blut enthält Hämocyanin auf Kupferbasis, das in kaltem, sauerstoffarmem Wasser effizient ist. Etwa zwei Drittel der rund 500 Millionen Nervenzellen liegen in den Armen, die teilweise selbstständig Entscheidungen treffen.","Kraken öffnen Schraubgläser, lösen Labyrinthe und erkennen einzelne Menschen.","Sie sind Wirbellose mit komplexem Verhalten und entwickelten Intelligenz auf einem ganz anderen Weg als Wirbeltiere."],
["Wie heiß ist ein Blitz?","Im Blitzkanal herrschen kurzzeitig Temperaturen von etwa 30.000 Grad Celsius, rund fünfmal so heiß wie die Sonnenoberfläche.","Die enorme Stromstärke von zehntausenden Ampere erhitzt die Luft blitzartig. Die Luft dehnt sich explosionsartig aus, was wir als Donner hören.","Zwischen Blitz und Donner liegen etwa drei Sekunden pro Kilometer Entfernung.","Blitze erzeugen zudem Stickoxide, die als natürlicher Dünger in den Boden gelangen."],
["Wozu dient Schlaf für das Gehirn?","Im Schlaf werden Erinnerungen gefestigt und Stoffwechselprodukte aus dem Gehirn abtransportiert.","Das Team um Maiken Nedergaard beschrieb 2013 im Mausgehirn das glymphatische System, das im Schlaf stärker durchspült wird. Ob und wie stark das beim Menschen genauso funktioniert, wird weiter untersucht.","Nach einer durchwachten Nacht fallen Konzentration und Gedächtnisleistung messbar ab.","Schlaf ist ein aktiver Prozess und keine bloße Pause."],
["Warum schwimmt Eis auf Wasser?","Wasser ist am dichtesten bei etwa 4 Grad Celsius, gefrorenes Wasser ist weniger dicht als flüssiges.","Wassermoleküle bilden beim Gefrieren ein offenes Kristallgitter aus Wasserstoffbrücken. Dadurch nimmt Eis rund neun Prozent mehr Volumen ein als die gleiche Masse Wasser.","Seen frieren von oben zu, am Grund bleibt Wasser flüssig, und Fische überleben den Winter.","Fast alle anderen Stoffe sind als Festkörper dichter als in flüssiger Form."],
["Warum ist es im Winter kalt, obwohl die Erde der Sonne dann näher ist?","Die Erde ist Anfang Januar der Sonne am nächsten, trotzdem ist dann Winter auf der Nordhalbkugel.","Verantwortlich ist die Neigung der Erdachse von etwa 23,4 Grad. Im Winter fällt das Licht flacher ein und die Tage sind kürzer. Der Abstand schwankt nur zwischen etwa 147 und 152 Millionen Kilometern.","Im Dezember und Januar steht die Sonne in Chemnitz mittags nur etwa 16 Grad über dem Horizont.","Auf der Südhalbkugel ist zur selben Zeit Sommer. Das zeigt, dass die Achsneigung entscheidend ist."]];
