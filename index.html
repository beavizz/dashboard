humor:['Ich bin nicht faul, ich bin im Energiesparmodus – das ist gut für die Umwelt.','Mein Kalender ist so voll, dass selbst die Pausen einen Termin haben.','Ich habe keine Aufschieberitis, ich habe einen sehr flexiblen Zeitplan.','Optimismus ist, wenn man den Absturz als Flugstunde verbucht.','Mein Zeitmanagement ist ausgezeichnet: Ich verschiebe alles pünktlich.','Ich bin nicht unordentlich, ich habe ein sehr offenes Ordnungssystem.','Manche Menschen hören auf ihr Bauchgefühl, ich höre auf mein WLAN.','Ich lese keine Anleitungen. Ich diskutiere mit dem Gerät.','Mein inneres Kind ist noch wach, mein äußeres braucht dringend Kaffee.','Ich habe schon Pläne für die Aufschieberei meiner Pläne.','Erwachsen sein heißt, das Loch im Pullover zu ignorieren.','Ich bin nicht distanziert, ich bin nur selektiv begeisterungsfähig.','Manchmal muss man sich selbst bei der Hand nehmen – am besten mit Kaffee.','Ich habe nichts verloren. Ich habe nur alles woanders hingelegt.','Mein Ego und ich haben eine offene Beziehung.','Ich brauche keine Meditation, nur fünf ungestörte Minuten.','Ich bin nicht schüchtern, ich bin nur im Standby-Modus.','Ich plane nicht zu viel, ich plane nur sehr kreativ.','Mein bestes Denken passiert unter der Dusche – ohne Stift.','Die Kaffeemaschine ist mein einziger verlässlicher Kollege.','Ich bin ein Frühaufsteher, wenn der Wecker dreimal klingelt.','Ordnung ist das halbe Leben. Die andere Hälfte ist Suchen.','Ich könnte was ändern, aber nicht heute. Heute ist Montag.','Meine Motivation hat Burnout und macht Homeoffice.','Ich bin nicht nervös, ich bin nur sehr wach.','Ich habe ein sehr gutes Gedächtnis, ich benutze es nur selten.','Manche sammeln Briefmarken, ich sammle unerledigte Aufgaben.','Ich bin nicht spät dran, ich laufe in einer eigenen Zeitzone.','Mein innerer Schweinehund ist mittlerweile ein Familienmitglied.','Ich brauche keinen Wecker, mein Kopf hat genug Sorgen.'],
weis:['Disziplin ist die Freundlichkeit, die du deinem späteren Ich schuldest.','Wer sich selbst nie widerspricht, hat vermutlich aufgehört nachzudenken.','Nicht jede Stille ist Leere. Manche ist eine Antwort.','Veränderung beginnt da, wo du aufhörst, anderen die Schuld zu geben.','Ein echtes Nein an andere ist ein Ja zu dir selbst.','Selbstwert ist keine Belohnung. Er ist eine Entscheidung.','Wer immer nur wartet, verwechselt Geduld mit Erstarrung.','Aufmerksamkeit ist die teuerste Währung. Verbringe sie bewusst.','Mut ist nicht die Abwesenheit von Angst, sondern der nächste Schritt.','Gedanken sind keine Fakten. Prüfe sie, bevor du sie glaubst.','Wer nicht trauert, kann nicht wirklich loslassen.','Gute Grenzen machen Beziehungen möglich, nicht unmöglich.','Ehrlichkeit dir selbst gegenüber ist der Anfang jeder Klarheit.','Du bist nicht deine Gedanken. Du bist der, der sie hört.','Schlaf ist keine Belohnung. Er ist Voraussetzung.','Der Vergleich mit anderen ist eine Steuer, die niemand verlangt hat.','Wer immer nur funktioniert, verliert irgendwann das Spüren.','Fehler sind Daten, keine Urteile.','Manchmal ist das Klügste, nichts zu tun.','Zu spät ist nicht zu spät. Es ist später.','Du kannst nicht jedem gefallen. Aber du kannst dir treu bleiben.','Kleine Gewohnheiten schlagen große Vorsätze.','Deine Vergangenheit erklärt dich. Sie bestimmt dich nicht.','Wer zu schnell verzeiht, hat oft nicht wirklich vergeben.','Vergib dir selbst zuerst, sonst bleibt jede Entschuldigung an der Oberfläche.','Echte Ruhe entsteht durch Anwesenheit im Augenblick.','Nicht jede Frage verlangt heute eine Antwort.','Du musst nicht erklären, warum du bist, wie du bist.','Wer sich selbst nicht kennt, erkennt sich im anderen nicht.','Freundlichkeit ist keine Schwäche. Sie ist kontrollierte Stärke.'],
